"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false
# scan_timeout = 100

format = """
[╭─](muted)\
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$fill\
$python\
$cmd_duration\
$line_break[╰─ ](muted)$character """

palette = 'theme'
command_timeout = 500

# Catppuccin's, in Omarchy's color names, until hyprdori-theme-set writes the theme's
[palettes.theme]
background = "#1e1e2e"
foreground = "#cdd6f4"
muted = "#585b70"
accent = "#89b4fa"
red = "#f38ba8"
bright_red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
orange = "#f6b6ab"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
