"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false
# scan_timeout = 100

format = """
[╭─](muted)\
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$fill\
$python\
$cmd_duration\
$line_break[╰─ ](muted)$character """

palette = 'theme'
command_timeout = 500

[fill]
symbol = " "

[os]
disabled = false
style = "accent"
format = "[ $symbol ]($style)"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = ""
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = ""
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "magenta"
style_root = "red"
format = '[ $user]($style)'

[hostname]
ssh_only = true 
ssh_symbol = "🌐 "

[directory]
style = "accent"
format = "[[  ](muted)]($style)[$path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Projects" = "󰲋 "
"projects" = "󰲋 "

[character]
disabled = false
# zsh's vi modes: typing (insert) cyan, normal orange, visual magenta, replace green; red after
# a failed command
success_symbol = '[󰶻](bold fg:cyan)'
error_symbol = '[󰶻](bold fg:red)'
vimcmd_symbol = '[󰶺](bold fg:orange)'
vimcmd_visual_symbol = '[󰶺](bold fg:magenta)'
vimcmd_replace_symbol = '[󰶺](bold fg:green)'
vimcmd_replace_one_symbol = '[󰶺](bold fg:green)'

[git_branch]
symbol = ""
format = '[[](muted)]($style)[[ $symbol $branch ](green)]($style)'

[git_status]
format = '[[($all_status$ahead_behind )](green)]($style)'

[cmd_duration]
format = "[[](muted)]($style) [$duration]($style) "
style = "bright_red"

# [python]
# symbol = " "
# style = "cyan"
# format = '[[ ($virtualenv )$symbol ](fg:cyan)]($style)'

[python]
symbol = " "
style = "cyan"
format = "[[](muted)]($style)[[( $virtualenv)](fg:cyan)]($style)[[ $symbol$version ](fg:cyan)]($style)"

[time]
disabled = false
time_format = "%R"
format = '[[](muted)]($style)[[  $time ](magenta)]($style)'

# Catppuccin's defaults, until hyprdori-theme-set writes the theme's
[palettes.theme]
background = "#1e1e2e"
foreground = "#cdd6f4"
muted = "#585b70"
accent = "#89b4fa"
red = "#f38ba8"
bright_red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
orange = "#f6b6ab"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
