# ~/.config/yazi/yazi.toml

[mgr]
show_hidden = false
ratio = [2, 3, 4]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "none"
tab_size = 4
show_symlink = true

[opener]
# Files are passed as %s1 (the first) and %s (all), quoted by yazi: current
# yazi no longer sets the shell's "$1"/"$@", which left xdg-open without a
# file. Default app (xdg-open) in its own session: setsid -f returns at once,
# so yazi forgets it and the app outlives yazi. Text and the like still open
# in $EDITOR in the terminal (yazi's `edit` rule).
open = [
	{ run = "setsid -f xdg-open %s1 >/dev/null 2>&1", desc = "Open", for = "linux" },
]
play = [
	{ run = "vlc %s", orphan = true, desc = "VLC", for = "linux" },
]
# swayimg lists the image's whole folder (imagelist.adjacent), so H/L browse it
swayimg = [
	{ run = "setsid -f swayimg %s >/dev/null 2>&1", desc = "swayimg", for = "linux" },
]
pinta_image = [
	{ run = "pinta %s", orphan = true, desc = "Pinta" },
]

# prepend_rules keeps yazi's own rules after these (Enter opens anything
# else with the default app, through xdg-open). A plain `rules = [...]`
# replaced all of them, so only images could be opened.
[open]
prepend_rules = [
	{ mime = "image/*", use = ["swayimg", "pinta_image", "open", "reveal"] },
]

[plugin]
# Office documents: page previews through LibreOffice (plugins/office.yazi).
# Matched by MIME type (with and without the "vnd." part, which depends on
# the yazi version) and by extension.
prepend_preloaders = [
	{ mime = "application/openxmlformats-officedocument.*", run = "office" },
	{ mime = "application/vnd.openxmlformats-officedocument.*", run = "office" },
	{ mime = "application/oasis.opendocument.*", run = "office" },
	{ mime = "application/vnd.oasis.opendocument.*", run = "office" },
	{ mime = "application/ms-*", run = "office" },
	{ mime = "application/vnd.ms-*", run = "office" },
	{ mime = "application/msword", run = "office" },
	{ url = "*.{doc,docx,xls,xlsx,ppt,pptx,odt,ods,odp,rtf}", run = "office" },
]
prepend_previewers = [
	{ mime = "application/openxmlformats-officedocument.*", run = "office" },
	{ mime = "application/vnd.openxmlformats-officedocument.*", run = "office" },
	{ mime = "application/oasis.opendocument.*", run = "office" },
	{ mime = "application/vnd.oasis.opendocument.*", run = "office" },
	{ mime = "application/ms-*", run = "office" },
	{ mime = "application/vnd.ms-*", run = "office" },
	{ mime = "application/msword", run = "office" },
	{ url = "*.{doc,docx,xls,xlsx,ppt,pptx,odt,ods,odp,rtf}", run = "office" },
]
