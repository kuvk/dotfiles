# Reload
unbind r
bind r source-file ~/.tmux.conf

# Leader key (twice sends a real Ctrl+S to the app)
set -g prefix C-s
bind C-s send-prefix

# Scrollback, and windows numbered like the keyboard
set -g history-limit 50000
set -g base-index 1
set -g renumber-windows on

# Mouse
set -g mouse on

# Window navigaton
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Resize panes: prefix, then H/J/K/L (repeats without the prefix for a moment)
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Clear terminal
bind C-l send-keys 'C-l'

# Status line on top
set-option -g status-position top

# Vi like copy paste commands
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
# Apps can set the clipboard too (nvim over SSH, through kitty)
set -s set-clipboard on

# Wayland
if-shell '[[ -n "$WAYLAND_DISPLAY" && "$(uname -s)" != "Darwin" ]]' {
	bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
	# P pastes the system clipboard, whatever copied to it
	bind P run "wl-paste -n | tmux load-buffer - && tmux paste-buffer -p"
	bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
}

# X11
if-shell '[[ -z "$WAYLAND_DISPLAY" && "$(uname -s)" != "Darwin" ]]' {
	bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
	bind P paste-buffer
	bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
}

# macOS
if-shell '[[ "$(uname -s)" == "Darwin" ]]' {
	bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
	bind P paste-buffer
	bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
}

# True color, and Shift+Enter and friends for apps that ask (extended keys)
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB'
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set-option -sg escape-time 10
set-option -g focus-events on

# Enable image preview
set -g allow-passthrough on

# List of plugins (TPM). The theme isn't one of them: see below.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jimeh/tmuxifier'

# ---- Theme --------------------------------------------------------------
# catppuccin/tmux with the system theme's colors: theme-set.py writes them as
# the "current" flavor into this copy and re-sources this file. One copy at a
# fixed path, loaded here and not through TPM (a second TPM copy, loaded last,
# kept the old colors). Cloned on first start; Mocha until theme-set has run.
# Pinned to a v2 release (status modules changed between versions)
if "test ! -d ~/.tmux/plugins/catppuccin/tmux" \
   "run 'git clone -q -b v2.3.2 https://github.com/catppuccin/tmux.git ~/.tmux/plugins/catppuccin/tmux'"
if-shell "test -f ~/.tmux/plugins/catppuccin/tmux/themes/catppuccin_current_tmux.conf" \
  "set -g @catppuccin_flavor 'current'" \
  "set -g @catppuccin_flavor 'mocha'"

# Options before the plugin runs, all with plain `set -g`, so every re-source
# rebuilds the styles from the current colors
set -g @catppuccin_status_background "#{@thm_bg}"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"
set -g @catppuccin_window_number_color "#{@thm_blue}"
set -g @catppuccin_window_current_text_color "#{@thm_bg}"
set -g @catppuccin_directory_text "#{pane_current_path}"
set -g @catppuccin_directory_color "#{@thm_mauve}"
set -g @catppuccin_status_middle_separator "#[fg=#{@thm_surface_0}]█"
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_pane_border_style "fg=#{@thm_surface_0}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_peach}"

run ~/.tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Selected text in copy mode, same as everywhere else
set -gF mode-style "bg=#{@thm_surface_1},fg=#{@thm_fg}"

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"

# Install TMUX plugin manager
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Install Plugins
if "test ! -d ~/.tmux/plugins/vim-tmux-navigator" \
    "run '~/.tmux/plugins/tpm/bin/install_plugins && tmux source ~/.tmux.conf'"

# # Set another status line for extra padding
if -F '#{!=:#{status},2}' {
    set -Fg 'status-format[1]' '#{status-format[0]}'
	set -g 'status-format[1]' ''
	set -g status 2
}
