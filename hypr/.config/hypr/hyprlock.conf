source = $HOME/.config/hypr/mocha.conf

$font = SF Pro Display
# $monitor1 = DP-1
# $monitor1 = DP-4
# $monitor1 = HDMI-A-1
# $monitor1 = HDMI-A-5
$monitor1 = eDP-1

# GENERAL
general {
  hide_cursor = true
}

# BACKGROUND
background {
  monitor =
  path =
  color = $baseTransparent
}

# TIME
label {
  monitor = $monitor1
  text = $TIME
  color = $green
  font_size = 90
  font_family = $font
  position = -30, 0
  halign = right
  valign = top
  shadow_passes = 3
}

# DATE
label {
  monitor = $monitor1
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $green
  font_size = 25
  font_family = $font
  position = -30, -150
  halign = right
  valign = top
  shadow_passes = 3
}

# USER AVATAR
image {
  monitor = $monitor1
  path = $HOME/.face
  size = 135
  border_color = $green
  border_size = 2
  position = 0, 75
  halign = center
  valign = center
  shadow_passes = 4
  shadow_size = 4
  shadow_boost = 0.5
}

# INPUT FIELD
input-field {
  monitor = $monitor1
  size = 250, 30
  outline_thickness = 1
  dots_size = 0.3
  dots_spacing = 0.2
  dots_center = true
  outer_color = $green
  inner_color = $subtext1Transparent
  font_color = $blue
  fade_on_empty = false
  placeholder_text = <span foreground="##$textAlpha" font_size='11pt'><i>󰌾  Logged in as </i><span foreground="##$blueAlpha" font_size='11pt' font_weight='bold'>$USER</span></span>
  hide_input = false
  check_color = $blue
  fail_color = $red
  fail_text = <i>ACCESS DENIED</i>
  capslock_color = $yellow
  position = 0, -47
  halign = center
  valign = center
  shadow_passes = 3
}
