# `loginctl lock-session` runs lock_cmd; the lock screen is Quickshell's (modules/lock)
general {
    lock_cmd = qs ipc call lock lock
    before_sleep_cmd = qs ipc call lock lock
    after_sleep_cmd = sleep 1; hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    # wait until the session lock is confirmed before suspending
    inhibit_sleep = 3
}

# Lock, screens off and sleep: the times from Settings > Idle (plugged in and on battery),
# written by Quickshell (services/Idle.qml), which also starts hypridle and restarts it when they
# or the power source change
source = ~/.config/hypr/configs/generated/hypridle.conf
