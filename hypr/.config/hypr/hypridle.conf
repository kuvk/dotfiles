# Locking is done by Quickshell (modules/lock). `loginctl lock-session`
# also works, it runs lock_cmd.
general {
    lock_cmd = qs ipc call lock lock
    # no slide animation before sleep, so nothing shows on resume
    before_sleep_cmd = qs ipc call lock lockNow
    after_sleep_cmd = ~/.config/scripts/lock-wake-redraw.sh
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    # wait until the session lock is confirmed before suspending
    inhibit_sleep = 3
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 1200
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = sleep 2; hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
