# Base kitty config

# Font: from Settings > Fonts (hyprdori-theme-set writes it), Nerd Font glyphs from Symbols Nerd
# Font, the size from Displays > Text size (below)
font_family JetBrainsMono Nerd Font
include ~/.config/theme/current/kitty-font.conf
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d4,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b1,U+e700-U+e7c5,U+f000-U+f2e0,U+f300-U+f372,U+f400-U+f532,U+f0001-U+f1af0 Symbols Nerd Font

# Window
window_padding_width 14
hide_window_decorations yes
# Close without asking, whatever runs inside (SUPER+Q)
confirm_os_window_close 0

# Cursor: a beam, as zsh's insert mode, for apps that set no shape of their own
shell_integration no-cursor
cursor_shape beam
cursor_beam_thickness 1
cursor_blink_interval 0
enable_audio_bell no
# Touchpad scrolling at a usable speed
touch_scroll_multiplier 10.0

# Copy with Ctrl+Shift+C; every selection would otherwise fill the clipboard history
copy_on_select no
strip_trailing_spaces always
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Shift+Enter and Alt+Shift+Enter as CSI-u, so TUIs and herdr can tell them apart from Enter
map shift+enter send_text all \e[13;2u
map alt+shift+enter send_text all \e[13;4u

# Ctrl+Shift+H: scrollback in Neovim, colors kept, y copies, q closes
scrollback_lines 10000
scrollback_pager nvim --noplugin -c "set signcolumn=no nonumber norelativenumber laststatus=0" -c "nnoremap q :qa!<CR>" -c "silent write! $XDG_RUNTIME_DIR/kitty-scrollback | terminal cat $XDG_RUNTIME_DIR/kitty-scrollback -"

# Tab bar
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Theme (hyprdori-theme-set writes it; kitty reloads on SIGUSR1)
include ~/.config/theme/current/kitty.conf

# Font size from Displays > Text size (written by hyprdori-monitors)
globinclude text-size.conf
