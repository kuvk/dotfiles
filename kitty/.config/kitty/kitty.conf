# linux_display_server x11
initial_window_width 125c
initial_window_height 40c
remember_window_size  no
# hide_window_decorations no

## window_padding_width top right bottom left
window_padding_width 1

tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

## Fonts
font_size 11
font_family      family='JetBrainsMono Nerd Font' postscript_name=JetBrainsMonoNF-Regular
bold_font        family='JetBrainsMono Nerd Font' postscript_name=JetBrainsMonoNF-Bold
italic_font      family='JetBrainsMono Nerd Font' postscript_name=JetBrainsMonoNF-Italic
bold_italic_font family='JetBrainsMono Nerd Font' postscript_name=JetBrainsMonoNF-BoldItalic

# Symbols - Nerd Fonts v3.1.0
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d4,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b1,U+e700-U+e7c5,U+f000-U+f2e0,U+f300-U+f372,U+f400-U+f532,U+f0001-U+f1af0 Symbols Nerd Font


# Cursor
shell_integration  no-cursor
cursor_blink_interval 0.5
mouse_hide_wait 2.0
cursor_beam_thickness 1

touch_scroll_multiplier 10.0

detect_urls yes
# Copy with Ctrl+Shift+C; every selection would otherwise fill the clipboard history
copy_on_select no
strip_trailing_spaces smart
# Ctrl+Shift+H: scrollback in nvim, colors kept, y copies, q closes
scrollback_lines 10000
scrollback_pager nvim --noplugin -c "set signcolumn=no nonumber norelativenumber laststatus=0" -c "nnoremap q :qa!<CR>" -c "silent write! $XDG_RUNTIME_DIR/kitty-scrollback | terminal cat $XDG_RUNTIME_DIR/kitty-scrollback -"
map ctrl+f5   load_config_file

## Underline
# modify_font underline_position 9
# modify_font underline_thickness 135%

# Theme (generated by ~/.config/scripts/theme-set.py, reloaded live)
include ~/.config/theme/current/kitty.conf

# Font size from Displays > Text size (written by hypr-monitors.py)
globinclude text-size.conf
