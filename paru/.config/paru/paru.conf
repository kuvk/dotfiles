# paru's settings. Replaces /etc/paru.conf, so its defaults are repeated here.
[options]
PgpFetch
Devel
Provides
DevelSuffixes = -git -cvs -svn -bzr -darcs -always -hg -fossil

# Remove build-only dependencies after each AUR build, so they don't pile up as orphans
RemoveMake
# Untracked build leftovers go too; the git clones stay, for quick -git updates
CleanAfter
# Show Arch news before a system upgrade
NewsOnUpgrade
