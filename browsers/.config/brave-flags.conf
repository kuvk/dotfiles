# Brave's launcher reads one flag per line; # lines are skipped
--enable-features=UseOzonePlatform
--ozone-platform=wayland
# Video frames through the GPU without shared buffers: no flicker in fullscreen video
--disable-gpu-memory-buffer-video-frames
