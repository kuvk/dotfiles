# /etc/sddm.conf, installed by sddm/install.sh. Only what differs from SDDM's defaults.
[General]
DisplayServer=wayland
# no on-screen keyboard
InputMethod=

[Theme]
Current=kuvk-shell
CursorTheme=Adwaita
CursorSize=24

[Wayland]
CompositorCommand=Hyprland --config /usr/share/sddm/hypr/hyprland.lua
