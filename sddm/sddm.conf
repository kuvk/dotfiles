# Local SDDM settings. SDDM reads this file last, after Hyprdori's in /etc/sddm.conf.d
# (hyprdori.conf, and autologin.conf with autologin), so what's set here wins. Uncomment a
# line and change it; it takes effect at the next login screen (a logout or a reboot).
# sddm/install.sh writes this file once and then leaves it as edited.
#
# Setting a key Hyprdori sets replaces Hyprdori's: [Theme] Current (the login screen's look),
# [General] DisplayServer and [Wayland] CompositorCommand (how it starts). Autologin is easier
# with sudo sddm/install.sh --autologin or --no-autologin.
# Every option: man sddm.conf

#[General]
# Num Lock at the login screen: on, off, or none to leave it as it is
#Numlock=on

#[Users]
# Preselect the last user and session
#RememberLastUser=true
#RememberLastSession=true
# Users left out of the list, by name, comma separated
#HideUsers=

#[Autologin]
# With autologin: log in again on its own after logging out
#Relogin=false
