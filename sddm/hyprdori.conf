# /etc/sddm.conf.d/hyprdori.conf, installed by sddm/install.sh: what Hyprdori needs, only where it
# differs from SDDM's defaults. Local settings go in /etc/sddm.conf, read after this.
[General]
DisplayServer=wayland
# no on-screen keyboard
InputMethod=

[Theme]
Current=hyprdori

[Wayland]
CompositorCommand=start-hyprland -- --config /usr/share/sddm/hypr/hyprland.lua
