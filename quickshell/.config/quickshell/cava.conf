# cava for the player visualizer (services/Cava.qml): bar heights as text,
# one frame per line, read by Quickshell. Not used by the cava app itself.
[general]
framerate = 30
autosens = 1
bars = 12
sleep_timer = 3

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 60
